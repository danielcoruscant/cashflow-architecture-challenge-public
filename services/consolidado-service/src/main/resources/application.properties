spring.application.name=consolidado-service
logging.structured.format.console=logstash
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
cosmos.endpoint=${COSMOS_ENDPOINT:}
cosmos.database=${COSMOS_DATABASE:consolidado}
servicebus.namespace=${SERVICE_BUS_NAMESPACE:}
servicebus.topic=${SERVICE_BUS_TOPIC:lancamentos-topic}
servicebus.subscription=${SERVICE_BUS_SUBSCRIPTION:consolidado-sub}
security.jwt.issuer-uri=${JWT_ISSUER_URI:}
security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:}
security.jwt.audience=${JWT_AUDIENCE:}
